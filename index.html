<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASS</title>
<style>
:root{
  --bg:#070908; --panel:#101411; --green:#28ff65; --orange:#ff9d1f; --red:#ff2424;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%,#182019 0,#090c0a 38%,#030403 100%);
  color:white; font-family:Arial,Helvetica,sans-serif; overflow:hidden;
}
.console{
  width:min(760px,94vw); height:min(900px,96vh); padding:28px;
  border:2px solid #273129; border-radius:28px; background:linear-gradient(#101511,#080a09);
  box-shadow:0 30px 90px #000, inset 0 0 40px #000; position:relative;
}
h1{margin:0;text-align:center;font-size:42px;letter-spacing:.22em}
.status{
  height:112px; margin:16px 0 24px; display:flex; align-items:center; justify-content:center;
  text-align:center; font-weight:900; font-size:clamp(25px,5vw,48px); line-height:1.05;
  text-transform:uppercase; text-shadow:0 0 16px currentColor;
}
.main{display:grid;grid-template-columns:1fr 150px;gap:42px;height:620px;align-items:center}
.faderArea{height:100%;display:flex;flex-direction:column;align-items:center}
.db{font:700 28px monospace;margin-bottom:10px}
.sliderWrap{height:520px;position:relative;width:150px}
input[type=range]{
  appearance:none; -webkit-appearance:none; width:500px;height:18px;position:absolute;
  left:-175px;top:240px;transform:rotate(-90deg);background:#222;border-radius:20px;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;width:58px;height:90px;border-radius:10px;
  background:linear-gradient(90deg,#bbb,#f5f5f5,#888);border:3px solid #111;
  box-shadow:0 0 15px #000;cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:58px;height:90px;border-radius:10px;background:#ddd;border:3px solid #111;cursor:pointer;
}
.meter{
  height:560px;width:112px;padding:10px;border-radius:15px;background:#020302;
  border:2px solid #273229;display:flex;flex-direction:column-reverse;gap:4px;
  box-shadow:inset 0 0 20px #000;
}
.seg{flex:1;border-radius:3px;background:#101511;transition:background .035s,box-shadow .035s}
.warning{
  position:absolute;inset:0;pointer-events:none;border-radius:28px;opacity:0;
  box-shadow:inset 0 0 70px var(--red),0 0 40px var(--red);
}
.warning.on{animation:alarm .52s infinite}
.lamp{
  position:absolute;top:28px;width:28px;height:28px;border-radius:50%;background:#260000;
  opacity:0;box-shadow:0 0 12px #f00;
}
.lamp.left{left:30px}.lamp.right{right:30px}
.lamp.on{opacity:1;animation:lamp .52s infinite}
@keyframes alarm{0%,100%{opacity:.08}50%{opacity:.55}}
@keyframes lamp{0%,100%{background:#400;box-shadow:0 0 10px #f00}50%{background:#ff1b1b;box-shadow:0 0 45px 18px #f00}}
.small{text-align:center;color:#7f8b82;font:14px monospace;margin-top:4px}
.channelDisplay{
  margin-top:12px; min-width:190px; padding:10px 18px;
  border:2px solid #26362b; border-radius:7px;
  background:linear-gradient(#071109,#020603);
  color:#8cff9e; text-align:center; font:700 20px monospace;
  letter-spacing:.06em; text-transform:uppercase;
  box-shadow:inset 0 0 14px #000,0 0 8px rgba(40,255,101,.12);
  text-shadow:0 0 8px rgba(80,255,110,.55);
}
.channelDisplay{
  margin-top:12px; min-width:180px; padding:9px 18px;
  border:2px solid #35443a; border-radius:7px;
  background:linear-gradient(#17251b,#0a130d);
  color:#8dff9f; text-align:center; font:700 18px monospace;
  letter-spacing:.04em; text-transform:uppercase;
  box-shadow:inset 0 0 13px #000,0 0 9px rgba(40,255,101,.13);
  text-shadow:0 0 7px rgba(40,255,101,.65);
}
.channelDisplay{
  margin-top:14px; min-width:180px; padding:9px 18px;
  border:2px solid #39423b; border-radius:7px;
  background:linear-gradient(#151b16,#080b09);
  color:#d8f6dd; text-align:center;
  font:700 18px/1.2 monospace; letter-spacing:.04em;
  text-shadow:0 0 7px rgba(130,255,155,.45);
  box-shadow:inset 0 0 12px #000,0 1px 0 rgba(255,255,255,.08);
}
.channelDisplay{
  margin-top:14px; min-width:190px; padding:9px 18px 8px;
  border:2px solid #313b34; border-radius:7px;
  background:linear-gradient(#0b170e,#061008);
  color:#8dff9f; text-align:center; font:700 18px monospace;
  letter-spacing:.04em; text-shadow:0 0 7px rgba(40,255,101,.7);
  box-shadow:inset 0 0 13px #000, 0 2px 8px #000;
}
.channelDisplay::before{
  content:"CHANNEL"; display:block; margin-bottom:2px;
  color:#526a58; font-size:9px; letter-spacing:.2em;
}
.channelDisplay{
  margin-top:14px; min-width:190px; padding:9px 14px;
  border:2px solid #29352c; border-radius:7px;
  background:linear-gradient(#08110b,#030704);
  color:#8dffa8; font:700 17px "Courier New",monospace;
  text-align:center; letter-spacing:.03em;
  box-shadow:inset 0 0 12px #000, 0 0 8px rgba(40,255,101,.12);
  text-shadow:0 0 7px rgba(40,255,101,.55);
}
.helpBox{
  position:absolute; right:28px; top:150px; width:210px; padding:18px;
  border:2px solid #28ff65; border-radius:16px; background:#09110b;
  box-shadow:0 0 24px rgba(40,255,101,.18), inset 0 0 18px #000;
  text-align:center; opacity:0; transform:translateX(20px) scale(.96);
  pointer-events:none; transition:.25s ease; z-index:5;
}
.helpBox.show{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.helpTitle{font-size:20px;font-weight:900;margin-bottom:13px;color:#fff}
.helpBtn{
  display:inline-block;padding:12px 16px;border:0;border-radius:10px;
  background:#28ff65;color:#031006;font-size:16px;font-weight:900;
  cursor:pointer;box-shadow:0 0 15px rgba(40,255,101,.45);
}
.helpBtn:hover{filter:brightness(1.18);box-shadow:0 0 25px rgba(40,255,101,.7)}

</style>
</head>
<body>
<div class="console">
  <div class="warning" id="warning"></div>
  <div class="lamp left" id="lamp1"></div><div class="lamp right" id="lamp2"></div>
  <h1>BASS</h1>
  <div class="helpBox" id="helpBox">
    <div class="helpTitle">Brauchst du Hilfe?</div>
    <button class="helpBtn" id="helpBtn">JA, BITTE!</button>
  </div>
  <div class="status" id="status">DER BASS IST AN</div>
  <div class="main">
    <div class="faderArea">
      <div class="db" id="db">0.0 dB</div>
      <div class="sliderWrap">
        <input id="fader" type="range" min="-12" max="12" step=".1" value="-12">
      </div>
      <div class="small">−12 dB&nbsp;&nbsp;&nbsp;→&nbsp;&nbsp;&nbsp;+12 dB</div>
      <div class="channelDisplay">Sub Master</div>
      <div class="channelDisplay">Sub Master</div>
      <div class="channelDisplay">Sub Master</div>
      <div class="channelDisplay">Sub Master</div>
      <div class="channelDisplay">ch01_Fickfader</div>
    </div>
    <div class="meter" id="meter"></div>
  </div>
</div>
<script>
const fader=document.getElementById('fader'), meter=document.getElementById('meter'),
statusEl=document.getElementById('status'), dbEl=document.getElementById('db');
const warning=document.getElementById('warning'), lamps=[document.getElementById('lamp1'),document.getElementById('lamp2')];
const helpBox=document.getElementById('helpBox'), helpBtn=document.getElementById('helpBtn');
helpBtn.addEventListener('click',()=>{ window.open('https://bassmussfckn.de', '_blank', 'noopener,noreferrer'); });
const N=34, segs=[];
for(let i=0;i<N;i++){let s=document.createElement('div');s.className='seg';meter.appendChild(s);segs.push(s)}

function state(v){
  if(v<=-6) return ["IST DER BASS ÜBERHAUPT AN?","#28ff65"];
  if(v<1.5) return ["DER BASS IST AN","#28ff65"];
  if(v<4.5) return ["DER BASS IST GUT","#5dff3a"];
  if(v<8) return ["DER BASS MACHT SPASS","#ff9d1f"];
  return ["DER BASS IST AM FICKEN","#ff2424"];
}
function update(){
  const v=+fader.value,[txt,col]=state(v);
  dbEl.textContent=(v>0?"+":"")+v.toFixed(1)+" dB";
  statusEl.textContent=txt; statusEl.style.color=col;
  const alarm=v>=8;
  warning.classList.toggle("on",alarm); lamps.forEach(x=>x.classList.toggle("on",alarm));
  helpBox.classList.toggle("show", v<=-6);
}
fader.addEventListener('input',update); update();

let smooth=0;
const BPM=120;
const beatMs=60000/BPM;
const startTime=performance.now();
function animate(now){
  const v=+fader.value;
  // Exact 120 BPM: one main kick pulse every 500 ms.
  const pos=((now-startTime)%beatMs)/beatMs;
  const kick=Math.exp(-pos*8.5);
  // Small secondary movement so the meter still feels alive between kicks.
  const body=Math.exp(-(((pos-.48)/.15)**2))*.16;
  const target=.12 + kick*.82 + body + Math.random()*.035;
  smooth += (target-smooth)*(target>smooth?.52:.10);

  // Fader actually increases indicated level.
  const gain=(v+12)/24;
  let level=Math.max(.04, Math.min(1, smooth*(.45+gain*.82)+gain*.19));
  const lit=Math.floor(level*N);

  // Normal = green. Around +3 dB orange appears only in the peaks.
  // High fader positions make peak segments red.
  for(let i=0;i<N;i++){
    const s=segs[i];
    if(i<lit){
      let c="#28ff65";
      const norm=i/(N-1);
      if(v>=3 && norm>.73 && level>.72) c="#ff9d1f";
      if(v>=7 && norm>.82 && level>.80) c="#ff2424";
      s.style.background=c;
      s.style.boxShadow="0 0 9px "+c;
    }else{
      s.style.background="#101511";s.style.boxShadow="none";
    }
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
