<!doctype html><html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BASS">
<title>BASS</title>
<style>
:root{--g:#28ff65;--o:#ff9d1f;--r:#ff2424}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030403;color:#fff;font-family:Arial,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 25%,#182019,#080b09 42%,#020302)}
.console{position:relative;width:min(760px,100%);height:100%;max-height:920px;min-height:620px;padding:18px 14px;border:2px solid #273129;border-radius:24px;background:linear-gradient(#101511,#080a09);box-shadow:0 20px 70px #000,inset 0 0 35px #000}
h1{margin:0;text-align:center;font-size:34px;letter-spacing:.2em}
.status{height:116px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(22px,6.2vw,42px);line-height:1.02;text-transform:uppercase;text-shadow:0 0 16px currentColor;padding:0 8px}
.main{height:calc(100% - 140px);display:grid;grid-template-columns:minmax(180px,1fr) 86px;gap:16px;align-items:center}
.faderArea{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.db{font:700 25px monospace;margin-bottom:4px}.small{font:12px monospace;color:#7f8b82}
.sliderWrap{height:min(57vh,510px);width:130px;position:relative}
input[type=range]{appearance:none;-webkit-appearance:none;position:absolute;width:min(52vh,470px);height:24px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);background:#222;border-radius:20px;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:64px;height:96px;border-radius:10px;background:linear-gradient(90deg,#aaa,#f5f5f5,#888);border:3px solid #111;box-shadow:0 0 15px #000}
input[type=range]::-moz-range-thumb{width:64px;height:96px;border-radius:10px;background:#ddd;border:3px solid #111}
.meter{height:min(60vh,540px);width:78px;padding:7px;border:2px solid #273229;border-radius:14px;background:#020302;display:flex;flex-direction:column-reverse;gap:3px;box-shadow:inset 0 0 20px #000}
.seg{flex:1;border-radius:3px;background:#101511}
.help{position:absolute;right:12px;top:245px;width:174px;padding:12px;border:2px solid var(--g);border-radius:15px;background:#09110b;text-align:center;box-shadow:0 0 24px #28ff6533;opacity:0;transform:scale(.94);pointer-events:none;transition:.2s;z-index:5}
.help.show{opacity:1;transform:scale(1);pointer-events:auto}.help b{display:block;font-size:16px;margin-bottom:8px}
.help button{border:0;border-radius:10px;background:var(--g);color:#031006;font-size:13px;font-weight:900;padding:10px 12px;box-shadow:0 0 15px #28ff6570}
.warn{position:absolute;inset:0;border-radius:24px;pointer-events:none;opacity:0;box-shadow:inset 0 0 70px var(--r)}
.warn.on{animation:alarm .5s infinite}.lamp{position:absolute;top:23px;width:22px;height:22px;border-radius:50%;background:#400;opacity:0}.lamp.l{left:18px}.lamp.r{right:18px}.lamp.on{opacity:1;animation:lamp .5s infinite}
@keyframes alarm{50%{opacity:.55}}@keyframes lamp{50%{background:#f22;box-shadow:0 0 35px 15px #f00}}
@media(min-width:700px){.main{grid-template-columns:1fr 130px;gap:40px}.meter{width:105px}.help{right:28px;width:210px}}
</style></head><body>
<div class="console"><div class="warn" id="warn"></div><div class="lamp l" id="l1"></div><div class="lamp r" id="l2"></div>
<h1>BASS</h1><div class="status" id="status"></div>
<div class="help" id="help"><b>Brauchst du Hilfe?</b><button id="helpBtn">JA, BITTE!</button></div>
<div class="main"><div class="faderArea"><div class="db" id="db"></div><div class="sliderWrap"><input id="fader" type="range" min="-12" max="12" step=".1" value="-12"></div><div class="small">−12 dB → +12 dB</div></div><div class="meter" id="meter"></div></div>
</div>
<script>
const fader=document.querySelector('#fader'),statusEl=document.querySelector('#status'),db=document.querySelector('#db'),meter=document.querySelector('#meter'),help=document.querySelector('#help'),warn=document.querySelector('#warn'),lamps=[document.querySelector('#l1'),document.querySelector('#l2')];
const segs=[];for(let i=0;i<34;i++){let x=document.createElement('div');x.className='seg';meter.appendChild(x);segs.push(x)}
document.querySelector('#helpBtn').onclick=()=>window.open('https://bassmussfckn.de','_blank','noopener,noreferrer');
function state(v){if(v<=-6)return['IST DER BASS ÜBERHAUPT AN?','#28ff65'];if(v<1.5)return['DER BASS IST AN','#28ff65'];if(v<4.5)return['DER BASS IST GUT','#5dff3a'];if(v<8)return['DER BASS MACHT SPASS','#ff9d1f'];return['DER BASS IST AM FICKEN','#ff2424']}
function update(){let v=+fader.value,[t,c]=state(v);statusEl.textContent=t;statusEl.style.color=c;db.textContent=(v>0?'+':'')+v.toFixed(1)+' dB';help.classList.toggle('show',v<=-6);let a=v>=8;warn.classList.toggle('on',a);lamps.forEach(x=>x.classList.toggle('on',a))}
fader.oninput=update;update();
let smooth=0;const BPM=120,beatMs=60000/BPM;
function animate(now){let v=+fader.value,p=(now%beatMs)/beatMs,k=Math.exp(-p*9),body=Math.exp(-p*4)*.25,target=.12+k*.72+body+Math.random()*.035;smooth+=(target-smooth)*(target>smooth?.52:.10);let gain=(v+12)/24,level=Math.max(.04,Math.min(1,smooth*(.45+gain*.82)+gain*.19)),lit=Math.floor(level*34);segs.forEach((s,i)=>{if(i<lit){let c='#28ff65',n=i/33;if(v>=3&&n>.73&&level>.72)c='#ff9d1f';if(v>=7&&n>.82&&level>.8)c='#ff2424';s.style.background=c;s.style.boxShadow='0 0 9px '+c}else{s.style.background='#101511';s.style.boxShadow='none'}});requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
